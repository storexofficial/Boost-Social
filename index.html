.wa-banner{background:linear-gradient(90deg,#0e9f6e,#25D366);color:#fff;height:32px;display:flex;align-items:center;gap:.45rem;padding:0 .4rem 0 0;font-size:.72rem;font-weight:500;position:sticky;top:0;z-index:60;overflow:hidden}

.drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,88vw);background:linear-gradient(180deg,#0f172a,#1e293b);z-index:100;transform:translateX(-105%);transition:transform .25s;display:flex;flex-direction:column;border-right:1px solid var(--border)}

.drawer-header{padding:1.1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800}
.brand-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800}

.topbar-brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1rem;flex:1;cursor:pointer;min-width:0}
.topbar-actions{display:flex;gap:.4rem;flex-shrink:0}

.container{max-width:1080px;margin:0 auto;padding:1.25rem 1rem}

async function route(){
  if(routing) return; routing=true;
  try{
    // non-blocking background refresh if we already have session
    if(!session) await refreshSession();
    else refreshSession();
    const {parts,path}=parseHash();
    track('page_view',null,path||'/');
    closeDrawer();
    const app=document.getElementById('app');

    if(parts[0]==='admin'){
      if(!session){renderLogin();return}
      if(!isAdmin()){app.innerHTML=`<div class="container"><p class="page-title">Access denied</p><p class="text-muted">Admin account required.</p><button class="btn btn-primary mt-4" onclick="goHash('/dashboard')">Dashboard</button></div>`;return}
      const sub=parts[1]||'dashboard';
      if(sub==='analytics') return await renderAdminAnalytics();
      if(sub==='orders') return await renderAdminOrders();
      if(sub==='platforms') return await renderAdminPlatforms();
      if(sub==='categories') return await renderAdminCategories();
      if(sub==='services') return await renderAdminServices();
      if(sub==='payments') return await renderAdminPayments();
      if(sub==='tickets') return await renderAdminTickets();
      if(sub==='settings') return await renderAdminSettings();
      if(sub==='order'&&parts[2]) return await renderAdminOrderDetail(parts[2]);
      return await renderAdminDashboard();
    }
    if(parts[0]==='login') return renderLogin();
    if(parts[0]==='signup') return renderSignup();
    if(parts[0]==='dashboard'){if(!session)return goHash('/login');return await renderDashboard()}
    if(parts[0]==='orders'){if(!session)return goHash('/login');return await renderOrders()}
    if(parts[0]==='order'){
      if(!session)return goHash('/login');
      if(!window.__keepWiz) wiz={step:1,platform:null,category:null,service:null,inputs:{},quantity:0};
      window.__keepWiz=false; return renderWizard();
    }
    if(parts[0]==='account'){if(!session)return goHash('/login');return renderAccount()}
    if(parts[0]==='support'){if(!session)return goHash('/login');return await renderSupport()}
    if(parts[0]==='payment'&&parts[1]){if(!session)return goHash('/login');return await renderPayment(parts[1])}
    if(parts[0]==='o'&&parts[1]){if(!session)return goHash('/login');return await renderOrderDetail(parts[1])}
    if(parts[0]==='p'&&parts[1]){
      const plat=platforms.find(x=>x.slug===parts[1]);
      if(!plat){app.innerHTML=`<div class="container"><p>Platform not found</p></div>`;return}
      if(parts[2]){const cat=categories.find(x=>x.platform_id===plat.id&&x.slug===parts[2]);if(!cat){app.innerHTML=`<div class="container"><p>Category not found</p></div>`;return}return renderCategoryPage(plat,cat)}
      return renderPlatformPage(plat);
    }
    return renderLanding();
  } finally { routing=false }
}

async function handleLogin(e){
  e.preventDefault();
  const id=document.getElementById('login-id').value.trim();
  const pass=document.getElementById('login-password').value;
  const err=document.getElementById('login-error');err.classList.add('hidden');
  let email=id;
  if(!id.includes('@')){
    const {data:em,error:rpcErr}=await sb.rpc('get_email_by_phone',{phone_input:id});
    if(rpcErr||!em){err.textContent=rpcErr?('Run sql/003_phone_login.sql — '+rpcErr.message):'No account for this phone';err.classList.remove('hidden');return}
    email=em;
  }
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){err.textContent=error.message;err.classList.remove('hidden');return}
  session=data.session;await refreshSession(true);toast('Welcome!');
  goHash(isAdmin()?'/admin':'/dashboard');
}
async function handleSignup(e){
  e.preventDefault();
  const name=document.getElementById('su-name').value.trim();
  const email=document.getElementById('su-email').value.trim();
  const phone=document.getElementById('su-phone').value.trim();
  const pass=document.getElementById('su-pass').value;
  const pass2=document.getElementById('su-pass2').value;
  const err=document.getElementById('signup-error');err.classList.add('hidden');
  if(pass!==pass2){err.textContent='Passwords do not match';err.classList.remove('hidden');return}
  if(phone.replace(/\D/g,'').length<10){err.textContent='Valid phone required';err.classList.remove('hidden');return}
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name,phone,role:'customer'}}});
  if(error){err.textContent=error.message;err.classList.remove('hidden');return}
  if(data.session){
    session=data.session;
    await sb.from('profiles').update({phone,full_name:name}).eq('id',data.user.id);
    await refreshSession(true);toast('Account created!');goHash('/dashboard');return;
  }
  const {data:ld,error:le}=await sb.auth.signInWithPassword({email,password:pass});
  if(le){err.textContent='Turn OFF Confirm email in Supabase Auth → Email provider, then try again.';err.classList.remove('hidden');return}
  session=ld.session;await sb.from('profiles').update({phone,full_name:name}).eq('id',ld.user.id);
  await refreshSession(true);toast('Account created!');goHash('/dashboard');
}

async function renderPayment(orderId){
  const {data:order}=await sb.from('orders').select('*').eq('id',orderId).single();
  if(!order||order.user_id!==session.user.id){toast('Order not found');return goHash('/orders')}
  if(order.status!=='pending_payment')return goHash('/o/'+orderId);
  currentPayOrder=order;selectedPayMethod=null;
  document.getElementById('app').innerHTML=`<div class="container" style="max-width:500px">
    <h1 class="page-title">Payment</h1><p class="page-sub">${order.order_number} · ${fmt(order.total_amount)}</p>
    <form class="card" style="padding:1.35rem" onsubmit="submitPayment(event)">
      <div id="pay-error" class="auth-error hidden"></div>
      ${payments.filter(p=>p.is_active).map(m=>`
        <label class="pay-method" id="pm-${m.id}"><input type="radio" name="pm" value="${m.id}" onchange="selectPay('${m.id}')"/>
        <div style="flex:1"><p class="font-bold">${m.name}</p>
        ${m.type==='local_wallet'?`<div class="pay-details-box">Account: <strong>${m.account_name||''}</strong><br>Number: <strong>${m.account_number||''}</strong><br><span class="text-xs text-muted">${m.instructions||''}</span></div>`:
        `<div class="pay-details-box">Wallet: <strong style="font-size:.75rem;word-break:break-all">${m.wallet_address||''}</strong><br>Network: <strong>${m.network||''}</strong></div>`}
        </div></label>`).join('')}
      <div id="pay-fields" class="hidden mt-4">
        <div class="form-group"><label class="label">Transaction ID</label><input class="input" id="pay-txid"/></div>
        <div class="form-group"><label class="label">Screenshot</label><input type="file" class="input" id="pay-file" accept="image/*"/></div>
      </div>

function selectPay(id){selectedPayMethod=payments.find(p=>p.id===id);document.querySelectorAll('.pay-method').forEach(el=>el.classList.remove('selected'));document.getElementById('pm-'+id).classList.add('selected');document.getElementById('pay-fields').classList.remove('hidden')}
async function submitPayment(e){
  e.preventDefault();const err=document.getElementById('pay-error');
  if(!selectedPayMethod){err.textContent='Select method';err.classList.remove('hidden');return}
  const txid=document.getElementById('pay-txid').value.trim();const file=document.getElementById('pay-file').files[0];
  if(!txid&&!file){err.textContent='TX ID or screenshot required';err.classList.remove('hidden');return}
  let path=null;
  if(file){
    if(file.size>4*1024*1024){err.textContent='Max 4MB';err.classList.remove('hidden');return}
    path=`${session.user.id}/${currentPayOrder.id}-${Date.now()}.${(file.name.split('.').pop()||'jpg')}`;
    const {error:upErr}=await sb.storage.from('payment-proofs').upload(path,file,{upsert:true});
    if(upErr){err.textContent=upErr.message;err.classList.remove('hidden');return}
  }
  const {error}=await sb.from('orders').update({status:'payment_verification',payment_method:selectedPayMethod.name,transaction_id:txid||null,payment_screenshot_path:path,updated_at:new Date().toISOString()}).eq('id',currentPayOrder.id);
  if(error){err.textContent=error.message;err.classList.remove('hidden');return}
  sb.from('order_status_history').insert({order_id:currentPayOrder.id,status:'payment_verification',changed_by:session.user.id});
  toast('Proof submitted');goHash('/o/'+currentPayOrder.id);
}

    <div class="card" style="padding:1.35rem;margin-bottom:1rem">
      <div class="summary-row"><span class="text-muted">Service</span><span class="font-bold">${order.service_name}</span></div>
      <div class="summary-row"><span class="text-muted">Platform</span><span class="font-bold">${order.platform_name} · ${order.category_name}</span></div>
      ${Object.entries(order.customer_inputs||{}).map(([k,v])=>`<div class="summary-row"><span class="text-muted">${FIELD_LABELS[k]||k}</span><span class="font-bold">${v}</span></div>`).join('')}
      <div class="summary-row total"><span>Total</span><span class="text-brand">${fmt(order.total_amount)}</span></div>
      ${order.payment_method?`<div class="summary-row"><span class="text-muted">Payment</span><span class="font-bold">${order.payment_method}</span></div>`:''}
      ${order.transaction_id?`<div class="summary-row"><span class="text-muted">TX</span><span class="font-bold">${order.transaction_id}</span></div>`:''}
    </div>${shot}
    <div class="card" style="padding:1.35rem;margin-bottom:1rem">
      <h2 class="font-bold mb-4">Update Status</h2>
      <select class="select" id="adm-st">${Object.keys(STATUS_LABELS).map(s=>`<option value="${s}" ${order.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}</select>
      <div class="form-group mt-4"><label class="label">Notes</label><textarea class="textarea" id="adm-notes" rows="2">${order.admin_notes||''}</textarea></div>
      <button class="btn btn-primary" onclick="adminSaveOrder('${order.id}')">Save</button>
    </div>
    ${order.status==='payment_verification'?`<div class="card" style="padding:1.35rem">
      <button class="btn btn-success" style="width:100%;margin-bottom:.5rem" onclick="adminVerify('${order.id}','payment_confirmed')">✓ Verify</button>
      <button class="btn btn-danger" style="width:100%" onclick="adminVerify('${order.id}','pending_payment')">✗ Reject</button>
    </div>`:''}
  </div>`;
}
async function adminSaveOrder(id){
  const st=document.getElementById('adm-st').value,notes=document.getElementById('adm-notes').value;
  await sb.from('orders').update({status:st,admin_notes:notes,updated_at:new Date().toISOString()}).eq('id',id);
  sb.from('order_status_history').insert({order_id:id,status:st,changed_by:session.user.id});
  toast('Updated');renderAdminOrderDetail(id);
}
async function adminVerify(id,status){
  await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);
  sb.from('order_status_history').insert({order_id:id,status,changed_by:session.user.id});
  toast(status==='payment_confirmed'?'Verified':'Rejected');renderAdminOrderDetail(id);
}

function fillCats(sel){const pid=document.getElementById('sf-p').value;document.getElementById('sf-c').innerHTML=categories.filter(c=>c.platform_id===pid).map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${c.name}</option>`).join('')}
async function saveSvc(id){
